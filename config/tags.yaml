# ---------------------------------------------------------------------------
# 현장 DCS/PLC 태그명 → 시스템 표준 변수명 매핑
# ---------------------------------------------------------------------------
# 사용법: 좌변(표준 변수명)은 고정. 우변(source)에 실제 현장 태그명을 적는다.
#   - source 가 null 이면 "해당 태그 미보유"로 간주하고, 그 태그를 쓰는 지표는
#     자동으로 배점에서 제외된다(잔여 지표로 100점 재배분).
#   - unit 은 참고용이며 loader 가 단위 변환을 하지는 않는다.
#
# 20대를 한 파일로 받을 때는 아래 `fleet` 블록의 규칙으로 설비별 컬럼을 분해한 뒤,
# 각 설비 데이터를 이 `source` 이름으로 되돌려 동일한 경로로 처리한다.
# ---------------------------------------------------------------------------

# --- 20대 통합 파일에서 설비별 컬럼을 찾는 규칙 -----------------------------
fleet:
  # 실제 태그명 = tag_pattern 에 설비 ID 와 아래 suffix 를 끼워 넣은 것
  #   예) VRT-A31101A + DP_BED  →  VRT-A31101A_DP_BED
  tag_pattern: "{equipment}_{suffix}"

  # 설비명이 붙지 않고 전 설비가 공유하는 컬럼
  shared:
    timestamp: TIMESTAMP

  suffixes:
    dp_bed: DP_BED
    dp_total: DP_TOTAL
    flow: FLOW
    fan_hz: FAN_HZ
    fan_amp: FAN_AMP
    damper_pct: DAMPER
    t_comb: COMB_PV
    t_comb_sp: COMB_SP
    t_in: T_INLET
    t_stack: T_STACK
    fuel_flow: FUEL
    burner_duty: BURNER_DUTY
    voc_in: VOC_IN
    voc_out: VOC_OUT
    ambient_temp: AMBIENT

  # 섹터별 온도: VRT-A31101A_SECTOR_01 … _12
  sector_suffix_prefix: SECTOR_

  # 특정 설비의 특정 태그만 이름이 다를 때 (현장 예외 대응)
  #   VRT-A31103C: {dp_bed: OLD_TAG_DPBED}
  equipment_overrides: {}

timestamp:
  source: TIMESTAMP
  unit: datetime
  required: true

# --- A군: 유동저항 ---------------------------------------------------------
dp_bed:
  source: RTO_DP_BED
  unit: mmH2O
  description: 축열재 베드 차압 (막힘의 직접 지표)
  required: true

dp_total:
  source: RTO_DP_TOTAL
  unit: mmH2O
  description: RTO 계통 전체 차압

flow:
  source: RTO_FLOW
  unit: CMM
  description: 처리 풍량
  required: true

fan_hz:
  source: FAN_INV_HZ
  unit: Hz
  description: 송풍기 인버터 주파수

fan_amp:
  source: FAN_CURRENT
  unit: A
  description: 송풍기 전류

damper_pct:
  source: DAMPER_OPEN
  unit: '%'
  description: 유량 조절 댐퍼 개도율

# --- B군: 온도 프로파일 ----------------------------------------------------
t_comb:
  source: TIC_COMB_PV
  unit: degC
  description: 연소실 온도 실측
  required: true

t_comb_sp:
  source: TIC_COMB_SP
  unit: degC
  description: 연소실 온도 설정치

t_in:
  source: TT_INLET
  unit: degC
  description: 유입가스 온도
  required: true

t_stack:
  source: TT_STACK
  unit: degC
  description: 배출(스택) 온도
  required: true

# 섹터별 축열층 출구온도. Can type 은 8~12 섹터.
# 보유하지 않은 섹터는 source 를 null 로 둔다.
t_sector:
  source_prefix: TT_SECTOR_    # 실제 태그: TT_SECTOR_01 ... TT_SECTOR_12
  count: 12
  unit: degC
  description: 섹터별 축열층 출구온도 (채널링 판정의 핵심)

# --- C군: 연료 / 효율 / VOC ------------------------------------------------
fuel_flow:
  source: FUEL_LNG_FLOW
  unit: Nm3/h
  description: 보조연료(LNG) 사용량

burner_duty:
  source: BURNER_DUTY
  unit: '%'
  description: 버너 가동률

voc_in:
  source: VOC_INLET
  unit: ppm
  description: 유입 VOC 농도

voc_out:
  source: TMS_OUTLET
  unit: ppm
  description: 배출 VOC 농도 (TMS)

# --- 보조 -----------------------------------------------------------------
ambient_temp:
  source: AMBIENT_TEMP
  unit: degC
  description: 외기 온도 (계절 보정용, 선택)
