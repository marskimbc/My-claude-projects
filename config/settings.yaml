# 분석/추천 파라미터. 값을 바꾸면 CLI 재실행만으로 반영된다.

data:
  lookback_days: 500        # 지표 계산용 조회 기간
  cache_dir: data/cache
  cache_ttl_hours: 12       # 장중 재조회 주기
  offline_seed: 20260812    # 오프라인(합성) 모드 재현용 시드

indicators:
  ma_short: 20
  ma_mid: 60
  ma_long: 120
  ma_trend: 200
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  bb_period: 20
  bb_std: 2.0

# 종합 점수 가중치 (합 1.0). 각 항목은 0~100 으로 정규화된 뒤 가중합된다.
scoring:
  weights:
    trend: 0.35             # 이동평균 배열/기울기
    momentum: 0.25          # 1/3/6개월 수익률, RSI 위치
    relative_strength: 0.20 # 벤치마크 대비 초과성과
    flow: 0.10              # 외국인/기관 순매수 (지수·개별주)
    risk: 0.10              # 변동성/낙폭 (낮을수록 고득점)
  momentum_windows: [20, 60, 120]

# 시장 국면 판정 임계값
regime:
  # KOSPI 가 200일선 위 + 20일선 > 60일선 이면 강세 가중
  bull_score: 60            # 이 점수 이상이면 risk-on
  bear_score: 40            # 이 점수 미만이면 risk-off
  # 국면별 총 주식 노출 한도
  exposure:
    risk_on: 1.00
    neutral: 0.60
    risk_off: 0.30

# 매매 신호 임계값
signals:
  buy_score: 70
  watch_score: 55
  reduce_score: 45
  sell_score: 35
  rsi_overbought: 75
  rsi_oversold: 30
  min_avg_trading_value: 500000000  # 20일 평균 거래대금 5억 미만은 제외

# 리스크 관리 (ATR 기반)
risk:
  account_risk_per_trade: 0.01   # 1회 매매당 계좌의 1% 리스크
  atr_stop_multiple: 2.0         # 손절 = 진입가 - 2*ATR
  atr_target_multiple: 4.0       # 목표 = 진입가 + 4*ATR (손익비 1:2)
  max_position_weight: 0.15      # 종목당 최대 비중
  max_theme_weight: 0.30         # 테마당 최대 비중
  max_total_weight: 0.80         # 추천 합계 최대 비중 (나머지는 현금)
  max_positions: 10

screener:
  top_n_per_theme: 5
  universe_size_per_theme: 40    # 테마별 구성종목 스캔 상한

backtest:
  initial_capital: 10000000
  fee_bps: 15                    # 왕복 수수료+세금 근사 (bp)
  rebalance: monthly             # monthly | weekly
