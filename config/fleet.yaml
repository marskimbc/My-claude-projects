# ---------------------------------------------------------------------------
# 설비 레지스트리 — RTO 20대
# ---------------------------------------------------------------------------
#   VRT = 유기배기 (고농도 VOC)   : A31101 A·B / A31102 A·B / A31103 A~E / A31105 A~E  = 14대
#   ORT = 냄새배기 (저농도·대풍량) : A31101 A·B / A31102 A·B / A31103 A·B              =  6대
#
# 설비 ID = {계열}{호기}  →  VRT-A31101A
#
# 설정 상속 우선순위:  overrides > series > types > defaults
#   값을 적지 않으면 상위에서 상속되므로, 아는 사양부터 채워 넣으면 된다.
#
# ⚠️ 풍량·설계차압·VOC 농도는 현재 자리표시자다. 실제 설비 사양으로 반드시 교체할 것.
#    이 값이 틀리면 운전 한계 도달 예측(RUL)과 정상운전 구간 판정이 어긋난다.
# ---------------------------------------------------------------------------

# --- 전 설비 공통 ----------------------------------------------------------
defaults:
  type: Can type (Rotary 1-Can)
  sector_count: 12
  media_type: honeycomb          # honeycomb | saddle (유량지수 초기값. 데이터로 자동 교정됨)
  design_flow_cmm: 900
  design_max_dp_mmh2o: 250
  recommended_cleaning_interval_h: 8760

# --- 배기 종류별 기본값 -----------------------------------------------------
# 유기배기와 냄새배기는 막힘 기전 자체가 다르다. 유기배기는 응축성 유기물·타르 고착이,
# 냄새배기는 분진 누적이 주 원인이므로 오염 속도와 세정 주기를 다르게 잡는다.
types:
  VRT:
    label: 유기배기
    design_voc_ppm: 400                      # 고농도 — 응축·고착 위험 큼
    recommended_cleaning_interval_h: 8760    # 1년
    dominant_fouling: 폴리머 응축 · 타르 고착
  ORT:
    label: 냄새배기
    design_voc_ppm: 80                       # 저농도·대풍량 — 분진 누적 위주
    recommended_cleaning_interval_h: 17520   # 2년
    dominant_fouling: 분진 누적

# --- 계열 정의 (호기는 자동 전개) -------------------------------------------
series:
  # ===== VRT 유기배기 14대 =====
  - {id: VRT-A31101, units: [A, B],          design_flow_cmm: 900,  design_max_dp_mmh2o: 250}
  - {id: VRT-A31102, units: [A, B],          design_flow_cmm: 900,  design_max_dp_mmh2o: 250}
  - {id: VRT-A31103, units: [A, B, C, D, E], design_flow_cmm: 600,  design_max_dp_mmh2o: 220}
  - {id: VRT-A31105, units: [A, B, C, D, E], design_flow_cmm: 600,  design_max_dp_mmh2o: 220}

  # ===== ORT 냄새배기 6대 =====
  - {id: ORT-A31101, units: [A, B],          design_flow_cmm: 1500, design_max_dp_mmh2o: 280}
  - {id: ORT-A31102, units: [A, B],          design_flow_cmm: 1500, design_max_dp_mmh2o: 280}
  - {id: ORT-A31103, units: [A, B],          design_flow_cmm: 1200, design_max_dp_mmh2o: 260}

# --- 개별 호기 예외 ---------------------------------------------------------
# 같은 계열인데 특정 호기만 사양이 다를 때 여기에 적는다.
overrides: {}
  # ORT-A31101B:
  #   design_flow_cmm: 1400

# ---------------------------------------------------------------------------
# 베이스라인(정상 기준) 지정
# ---------------------------------------------------------------------------
# 지금부터 데이터를 누적하기 시작하면 데이터 안에 "세정 직후 깨끗한 구간"이 없을 수 있다.
# 그 상태로 자동 선정에 맡기면 이미 오염된 구간을 정상으로 학습해 막힘을 영영 못 잡는다.
#
# 우선순위:
#   ① period  — 깨끗했던 구간을 직접 지정 (가장 정확)
#   ② manual  — 시운전/설계값을 직접 입력 (구간을 특정할 수 없을 때)
#   ③ 미지정  — 마지막 full_clean 이후 14일, 그것도 없으면 데이터 앞 14일
#               → 이 경우 "베이스라인 오염 의심" 경고가 표시되고,
#                 동급기 비교 지표(A6)가 이를 교차 검증한다.
# ---------------------------------------------------------------------------
baselines: {}
  # VRT-A31103C:
  #   period: {start: 2026-03-15, end: 2026-03-29}
  #
  # VRT-A31101A:
  #   manual: {dp_bed: 78, ter: 0.95, flow: 900, t_in: 40}

# ---------------------------------------------------------------------------
# 설비별 정비 이력 (수기 관리)
# ---------------------------------------------------------------------------
# type: full_clean | media_replace | partial_replace | bakeout | inspection
# full_clean / media_replace 는 베이스라인을 리셋한다.
# ---------------------------------------------------------------------------
maintenance_events: {}
  # VRT-A31103C:
  #   - {date: 2026-03-14, type: full_clean, note: 축열재 전량 수세정}
  #   - {date: 2026-07-20, type: bakeout,    note: online bake-out 8시간}
